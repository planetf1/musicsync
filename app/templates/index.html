{% extends "base.html" %}
{% block content %}
<section>
  <h2>Connections</h2>
  <ul>
    <li>
      Spotify:
      <strong class="{{ 'status-connected' if spotify_ok else 'status-disconnected' }}">{{ 'Connected' if spotify_ok else 'Not Connected' }}</strong>
      {% if not spotify_ok %}
        <a class="btn" href="/auth/spotify/login">Connect Spotify</a>
      {% endif %}
    </li>
    <li>
      TIDAL:
      <strong class="{{ 'status-connected' if tidal_ok else 'status-disconnected' }}">{{ 'Connected' if tidal_ok else 'Not Connected' }}</strong>
      {% if not tidal_ok %}
        <button class="btn" onclick="startTidal()">Connect TIDAL</button>
        <button class="btn" onclick="checkTidal()">Check Status</button>
        <div id="tidal-link" style="margin-top:8px"></div>
        <script>
          let pollTimer;
          function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(checkTidal, 4000);
          }
          function ensureAbsolute(u){
            if(!u) return null;
            return (/^https?:\/\//i.test(u)) ? u : ('https://' + u.replace(/^\/+/, ''));
          }
          function buildTidalLink(data){
            const complete = data.verification_uri_complete;
            const base = data.verification_uri;
            const code = data.user_code;
            if (complete) return ensureAbsolute(complete);
            if (base && code) return ensureAbsolute((base || '').replace(/\/+$/, '') + '/' + code);
            if (base) return ensureAbsolute(base);
            return 'https://link.tidal.com/';
          }
          async function startTidal() {
            const resp = await fetch('/auth/tidal/start');
            const data = await resp.json();
            const div = document.getElementById('tidal-link');
            const link = buildTidalLink(data);
            const code = data.user_code ? `<div style="margin-top:6px">Code: <strong>${data.user_code}</strong></div>` : '';
            const expires = data.expires_in ? `<div>Expires in ~${Math.floor(data.expires_in)} seconds</div>` : '';
            div.innerHTML = `Visit <a href="${link}" target="_blank">${link}</a> to link your account.${code}${expires}`;
            startPolling();
          }
          async function checkTidal() {
            const resp = await fetch('/auth/tidal/status');
            const data = await resp.json();
            const div = document.getElementById('tidal-link');
            if (data.logged_in) {
              if (pollTimer) clearInterval(pollTimer);
              div.innerHTML = '<span class="status-connected">TIDAL connected. Refreshing…</span>';
              window.location.reload();
              return;
            }
            if (data.error) {
              div.innerHTML = `<span class="status-disconnected">${data.error}</span>`;
            } else if (data.pending) {
              div.innerHTML = 'Waiting for TIDAL confirmation…';
            }
          }
        </script>
      {% endif %}
    </li>
  </ul>
  <div class="actions">
    <button id="btn-sync-artists" class="btn" onclick="startArtistSync()" {% if not (spotify_ok and tidal_ok) %}disabled{% endif %}>Sync Followed Artists</button>
    <div id="artist-sync-progress" style="margin-top:8px"></div>
    <script>
      let artistSyncTimer;
      async function startArtistSync(){
        const btn = document.getElementById('btn-sync-artists');
        const div = document.getElementById('artist-sync-progress');
        btn.disabled = true;
        div.textContent = 'Starting sync…';
        try{
          const debugLimit = document.getElementById('chk-limit-25')?.checked ? 25 : 0;
          const url = debugLimit ? ('/sync/artists/start?limit=' + debugLimit) : '/sync/artists/start';
          const resp = await fetch(url, {method:'POST'});
          if(!resp.ok){
            div.textContent = 'Failed to start sync.';
            btn.disabled = false;
            return;
          }
          const data = await resp.json();
          pollArtistSync(data.job_id);
        }catch(e){
          div.textContent = 'Error starting sync: ' + e;
          btn.disabled = false;
        }
      }
      async function pollArtistSync(jobId){
        if(artistSyncTimer) clearInterval(artistSyncTimer);
        const div = document.getElementById('artist-sync-progress');
        const render = async () => {
          try{
            const r = await fetch('/sync/artists/status?job_id='+encodeURIComponent(jobId));
            if(!r.ok){ div.textContent = 'Sync status unavailable'; return; }
            const s = await r.json();
            if(s.state === 'error'){
              div.innerHTML = `<span class="status-disconnected">Error: ${s.error||'unknown'}</span>`;
              clearInterval(artistSyncTimer);
              document.getElementById('btn-sync-artists').disabled = false;
              return;
            }
            const total = s.total ?? 0;
            const processed = s.processed ?? 0;
            const autoMatched = s.auto_matched ?? 0;
            const pend = s.pending_count ?? 0;
            if(s.state === 'done'){
              div.innerHTML = `<span class="status-connected">Done.</span> Artists: ${total}, auto-matched: ${autoMatched}, pending: ${pend}. <a href="/pending">Review pending</a>`;
              clearInterval(artistSyncTimer);
              document.getElementById('btn-sync-artists').disabled = false;
              return;
            }
            div.textContent = `Syncing… ${processed}/${total} (auto: ${autoMatched}, pending: ${pend})`;
          }catch(e){
            div.textContent = 'Error reading status: ' + e;
          }
        };
        await render();
        artistSyncTimer = setInterval(render, 2000);
      }
    </script>
  </div>
  <div style="margin-top:6px">
    <label><input type="checkbox" id="chk-limit-25" /> Debug: limit to first 25 artists</label>
  </div>
  
</section>
{% endblock %}
