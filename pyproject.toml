[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicsync"
version = "0.1.0"
description = "Sync Spotify library to TIDAL with FastAPI UI"
authors = [
  { name = "planetf1" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["spotify", "tidal", "sync", "fastapi", "music"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Sound/Audio",
]

# Runtime dependencies
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.23",
  "jinja2>=3.1",
  "sqlalchemy>=1.4",
  "spotipy>=2.23",
  "tidalapi>=0.7",
  "rapidfuzz>=3.5",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/planetf1/musicsync"
Issues = "https://github.com/planetf1/musicsync/issues"

[project.scripts]
# After installation, users can run `musicsync` to start the server
musicsync = "app.main:run"

[tool.setuptools]
# Ensure package data like templates/static are included
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "static/*",
]
