{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; text-align: center; animation: fadeIn 0.8s ease;">
  <h2 style="margin-bottom: 1.5rem;">Connect to Apple Music</h2>

  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    MusicSync uses <strong>MusicKit JS</strong> for secure authentication.
    You'll be prompted to sign in with your Apple ID to authorize this application.
  </p>

  <div id="status-area" style="margin-bottom: 2rem;">
    <div id="status-message" class="card"
      style="display: none; padding: 1rem; margin-bottom: 1rem; font-size: 0.95rem;"></div>
  </div>

  <button id="apple-music-authorize-btn" class="btn"
    style="width: 100%; display: none; align-items: center; justify-content: center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
      <path
        d="M18.71 19.5c-.83 1.24-1.71 2.45-3.1 2.48-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .76-3.27.82-1.31.05-2.31-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.24-1.99 1.1-3.14-1.02.04-2.25.68-2.98 1.54-.65.76-1.22 1.96-1.07 3.08 1.13.09 2.25-.63 2.95-1.48z" />
    </svg>
    Authorize Apple Music
  </button>

  <div id="loading-spinner" style="margin: 20px 0;">
    <div class="progress-bar" style="max-width: 200px; margin: 0 auto;">
      <div class="progress-fill" style="width: 100%; animation: pulse 1.5s infinite;"></div>
    </div>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 10px;">Initializing MusicKit...</p>
  </div>
</div>

<style>
  @keyframes pulse {
    0% {
      opacity: 0.4;
    }

    50% {
      opacity: 0.8;
    }

    100% {
      opacity: 0.4;
    }
  }
</style>

<script src="https://js-cdn.music.apple.com/musickit/v1/musickit.js"></script>
<script>
  document.addEventListener('musickitloaded', async () => {
    const statusMsg = document.getElementById('status-message');
    const authBtn = document.getElementById('apple-music-authorize-btn');
    const spinner = document.getElementById('loading-spinner');

    function showStatus(msg, type = 'info') {
      statusMsg.style.display = 'block';
      statusMsg.textContent = msg;
      statusMsg.style.borderColor = type === 'error' ? 'var(--accent)' : 'var(--primary)';
      statusMsg.style.color = type === 'error' ? 'var(--accent)' : 'var(--text)';
    }

    try {
      const response = await fetch('/auth/apple/developer-token');
      const data = await response.json();
      const developerToken = data.token;

      MusicKit.configure({
        developerToken: developerToken,
        app: {
          name: 'MusicSync',
          build: '1.0.0'
        }
      });

      const music = MusicKit.getInstance();
      spinner.style.display = 'none';
      authBtn.style.display = 'inline-flex';

      authBtn.addEventListener('click', async () => {
        try {
          showStatus('Authenticating...', 'info');
          await music.authorize();

          const musicUserToken = music.musicUserToken;
          const storefront = music.storefrontId;

          const saveResponse = await fetch('/auth/apple/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              music_user_token: musicUserToken,
              storefront: storefront
            })
          });

          if (saveResponse.ok) {
            showStatus('Successfully connected! Redirecting...', 'info');
            setTimeout(() => window.location.href = '/', 1500);
          } else {
            showStatus('Failed to save connection to server.', 'error');
          }
        } catch (error) {
          console.error('Authorization failed', error);
          showStatus('Authorization failed: ' + error.message, 'error');
        }
      });

    } catch (err) {
      console.error('Failed to initialize MusicKit', err);
      spinner.style.display = 'none';
      showStatus('Error initializing Apple Music integration.', 'error');
    }
  });
</script>
{% endblock %}
