[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicsync"
version = "0.1.0"
description = "Sync Spotify library to TIDAL with FastAPI UI"
authors = [
  { name = "planetf1" }
]
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["spotify", "tidal", "sync", "fastapi", "music"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Sound/Audio",
]

# Runtime dependencies
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.23",
  "jinja2>=3.1",
  "sqlalchemy>=1.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "spotipy>=2.23",
  "tidalapi>=0.7",
  "rapidfuzz>=3.5",
  "python-multipart>=0.0.9",
  "PyJWT>=2.10",
  "cryptography>=44.0",
]

[project.urls]
Homepage = "https://github.com/planetf1/musicsync"
Issues = "https://github.com/planetf1/musicsync/issues"

[project.scripts]
# After installation, users can run `musicsync` to start the server
musicsync = "app.main:run"

[tool.setuptools]
# Ensure package data like templates/static are included
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "static/*",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # isort
  "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true  # third-party libs like tidalapi/spotipy lack type hints
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
